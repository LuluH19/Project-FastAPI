version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-contacts-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend:/app
      - ./backend/contacts.db:/app/contacts.db
    restart: unless-stopped
    networks:
      - app-network

  # Optionnel : Ajouter PostgreSQL pour la production
  # db:
  #   image: postgres:15-alpine
