name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        cd backend
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        pip install black
        cd backend
        black --check --diff .
      continue-on-error: true
    
    - name: Test with pytest
      run: |
        cd backend
        pip install pytest pytest-asyncio httpx
        pytest tests/ -v
      continue-on-error: true
    
    - name: Run API tests
      run: |
        cd backend
        # Démarrer le serveur en arrière-plan
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        SERVER_PID=$!
        
        # Attendre que le serveur démarre
        sleep 5
        
        # Vérifier que le serveur est actif
        curl -f http://localhost:8000/health || exit 1
        
        # Exécuter les tests
        python test_api_auto.py || true
        
        # Arrêter le serveur
        kill $SERVER_PID
    
    - name: Check for security vulnerabilities
      run: |
        pip install safety
        cd backend
        safety check --json || true
      continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint mypy
        cd backend
        pip install -r requirements.txt
    
    - name: Run pylint
      run: |
        cd backend
        pylint **/*.py --exit-zero
      continue-on-error: true
    
    - name: Run mypy (type checking)
      run: |
        cd backend
        mypy . --ignore-missing-imports
      continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t fastapi-contacts:latest -f backend/Dockerfile backend/ || echo "Dockerfile not found, skipping"
      continue-on-error: true
    
    - name: Test Docker image
      run: |
        docker run -d -p 8000:8000 --name test-container fastapi-contacts:latest || echo "Docker test skipped"
        sleep 5
        curl -f http://localhost:8000/health || echo "Docker health check skipped"
        docker stop test-container || true
        docker rm test-container || true
      continue-on-error: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy notification
      run: |
        echo "🚀 Ready to deploy to production!"
        echo "Add your deployment steps here (Railway, Heroku, AWS, etc.)"
